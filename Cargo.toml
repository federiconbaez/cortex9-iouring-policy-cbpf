[package]
name = "iouring-policy-cbpf"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Compile declarative io_uring policies to classic BPF for IORING_REGISTER_BPF_FILTER"
repository = "https://github.com/federiconbaez/cortex9-iouring-policy-cbpf"
keywords = ["io_uring", "cbpf", "seccomp", "sandbox", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]
authors = ["Federico Nicolas Báez Rizzo"]
default-run = "iouring-policy"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[[bin]]
name = "iouring-policy"
path = "src/main.rs"

[[bin]]
name = "iouring-policy-enforce"
path = "src/bin/iouring-policy-enforce.rs"

[lib]
name = "iouring_policy_cbpf"
path = "src/lib.rs"
