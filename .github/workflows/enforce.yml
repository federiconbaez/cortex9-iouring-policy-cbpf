name: enforce

# Enforcement real en el kernel del runner. Separado de ci.yml a propósito:
# sin continue-on-error ni #[ignore]; si el kernel no soporta la feature,
# el binario sale con exit != 0 y este workflow queda rojo de forma visible.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  enforce:
    name: enforce (IORING_REGISTER_BPF_FILTER, Linux >= 7.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: kernel
        run: uname -a; cat /proc/sys/kernel/osrelease
      - name: enforce (falla fuerte si no está soportado)
        run: cargo run --bin iouring-policy-enforce
